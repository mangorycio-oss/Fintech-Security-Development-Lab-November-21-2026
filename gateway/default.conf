# FastAPI routes exposed by the web API. The bank has its own entry point.
map $uri $allowed_method {
    default "";
    ~^/$ GET;
    ~^/(docs(/oauth2-redirect)?|redoc|openapi\.json)$ "GET, HEAD";
    ~^/section-1/(sql|xss)/(before|after)$ POST;
    ~^/section-1/csrf/(before|after/(samesite|origin|token))$ POST;
    ~^/section-1/csrf/(samesite/session|token)$ GET;
    ~^/section-2/auth/(register|login|mfa)$ POST;
    ~^/section-2/(auth/me|bank/(accounts|status|callback|connect/[^/]+)|webauthn/browser)$ GET;
    ~^/section-2/bank/connect$ POST;
    ~^/section-2/payments$ POST;
    ~^/section-2/payments/[^/]+(/receipt)?$ GET;
    ~^/section-2/webauthn/(register/(options|verify)|approve/([^/]+/options|verify))$ POST;
}

map "$allowed_method:$request_method" $method_allowed {
    default 0;
    "GET:GET" 1;
    "POST:POST" 1;
    "GET, HEAD:GET" 1;
    "GET, HEAD:HEAD" 1;
}

map $status $allow_header {
    default "";
    405 $allowed_method;
}

map $uri $cache_control {
    default $upstream_http_cache_control;
    ~^/section-2(/|$) no-store;
}

# OAuth codes and one-time browser tickets must stay out of access logs.
map $uri $logged_path {
    default $uri;
    ~^/section-2/bank/connect/ /section-2/bank/connect/[ticket];
}

log_format gateway '$remote_addr $request_method $logged_path $status $request_id';

limit_req_zone $binary_remote_addr zone=web_requests:10m rate=10r/s;

upstream web_api {
    server unix:/run/web-api/api.sock;
}

server {
    listen 8000;
    access_log /var/log/nginx/access.log gateway;
    client_max_body_size 256k;
    limit_req_status 429;

    add_header Allow $allow_header always;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $cache_control always;

    location / {
        if ($allowed_method = "") { return 404; }
        if ($method_allowed = 0) { return 405; }

        limit_req zone=web_requests burst=30 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Cache-Control;
        proxy_hide_header Allow;
        proxy_pass http://web_api/;
    }
}
