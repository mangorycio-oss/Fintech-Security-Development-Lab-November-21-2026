services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CSRF_TRUSTED_ORIGIN: http://localhost:8002
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      CSRF_TRUSTED_ORIGIN: http://localhost:8002
    ports:
      - "127.0.0.1:8502:8501"
