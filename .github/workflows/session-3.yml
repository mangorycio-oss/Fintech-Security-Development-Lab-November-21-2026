name: Session 3 DevSecOps

on:
  pull_request:
  push:
    branches:
      - 'session-3/**'

permissions:
  contents: read

jobs:
  devsecops:
    name: Session 3 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: session3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Scan Python source
        run: session3/check.sh source

      - name: Audit Python dependencies
        run: session3/check.sh dependencies

      - name: Build or pull Session 2 images
        run: session3/check.sh build

      - name: Scan Compose images
        run: session3/check.sh images

      - name: Start Compose
        id: compose
        run: session3/check.sh start

      - name: Observe normal Gateway traffic with ZAP
        run: session3/check.sh passive

      - name: Run unittest including Gateway checks
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        run: session3/check.sh test

      - name: Capture Compose logs on failure
        if: failure()
        run: session3/check.sh logs

      - name: Stop Compose
        if: always()
        run: session3/check.sh stop

      - name: Upload passive DAST report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zap-passive
          path: ${{ runner.temp }}/zap/zap-passive.html
          if-no-files-found: ignore
