name: Session 3 DevSecOps

on:
  pull_request:
  push:
    branches:
      - 'session-3/**'

permissions:
  contents: read

jobs:
  devsecops:
    name: Session 3 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: session3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Scan Python source
        run: bandit -r web bank shared frontend --exit-zero

      - name: Audit Python dependencies
        run: |
          for requirements in requirements-api.txt frontend/requirements.txt; do
            echo "Auditing $requirements"
            report=$(mktemp)
            status=0
            pip-audit -r "$requirements" --format json --desc off --output "$report" || status=$?
            jq . "$report"
            if [[ "$status" == 1 ]] && jq -e 'any(.dependencies[]; .vulns | length > 0)' "$report" >/dev/null; then
              echo "::warning::Known vulnerabilities in $requirements. Review the report above."
            elif [[ "$status" != 0 ]]; then
              exit "$status"
            fi
          done

      - name: Build or pull Compose images
        run: |
          docker compose build
          docker compose pull gateway

      - name: Scan Compose images
        run: |
          scan_dir=$(mktemp -d)
          images=$(docker compose config --images)
          for image in $images; do
            echo "Scanning $image"
            docker save -o "$scan_dir/image.tar" "$image"
            docker run --rm --mount "type=bind,source=$scan_dir,target=/scan" \
              ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --cache-dir /scan/cache \
              --scanners vuln --no-progress --exit-code 0 --input /scan/image.tar
          done

      - name: Start Compose
        id: compose
        run: docker compose up --no-build -d --wait --wait-timeout 120

      - name: Observe normal Gateway traffic with ZAP
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          chmod a+w "$RUNNER_TEMP/zap"
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$PWD/.github/zap-passive.yml:/zap/plan.yml:ro" \
            -v "$RUNNER_TEMP/zap:/zap/reports" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af zap.sh -cmd -autorun /zap/plan.yml
          test -s "$RUNNER_TEMP/zap/zap-passive.html"

      - name: Run unittest including Gateway checks
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        run: |
          docker compose run --rm --no-deps \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e TEST_GATEWAY_URL=http://gateway:8000 \
            -v "$PWD:/workspace:ro" \
            api python -m unittest discover -v

      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload passive DAST report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: zap-passive
          path: ${{ runner.temp }}/zap/zap-passive.html
          if-no-files-found: ignore
